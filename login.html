<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · cool-light preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: { colors: {
    app: { bg:'#F8FAFC', sidebar:'#F1F5F9', active:'#EFF6FF' },
    primary: { 500:'#3b82f6', 600:'#2563eb' }
  }}}
}
</script>
<style>
:root { --accent:#3b82f6; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex w-12 h-12 rounded-2xl bg-blue-500 items-center justify-center shadow-sm shadow-blue-500/25 mb-4">
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
      </div>
      <h1 class="text-xl font-bold text-slate-900 tracking-tight">包装追踪系统</h1>
      <p class="text-sm text-slate-500 mt-1">内部系统，请登录后使用</p>
    </div>
    <form class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">用户名</label>
        <input type="text" value="admin" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">密码</label>
        <input type="password" value="••••••••" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400" />
      </div>
      <button type="button" class="w-full py-2.5 rounded-xl text-sm font-semibold text-white bg-blue-500 hover:bg-blue-600 transition-colors">登录</button>
    </form>
    <p class="text-center text-[11px] text-slate-400 mt-6">账号由管理员分配 · 请勿将密码告知外部人员</p>
    <p class="text-center text-[10px] text-slate-300 mt-2">preview · ui/cool-light-theme</p>
  </div>
</body>
</html>
